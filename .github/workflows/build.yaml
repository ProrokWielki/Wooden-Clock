  Arduino:
    runs-on: ubuntu-latest
    container:
      image: pawelwarzecha/wooden_clock:${{ env.IMAGE_VERSION }}
    steps:
    - name: Check out code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ secrets.PAT_TOKEN }}
    - name: build 
      run: mkdir -p Software/ESP && arduino-cli compile -b esp8266:esp8266:nodemcuv2 ESP.ino
