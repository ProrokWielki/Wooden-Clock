name: Build

env:
  IMAGE_VERSION: 0.3.0

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  x86_Clang:
    runs-on: ubuntu-latest
    container:
      image: pawelwarzecha/wooden_clock:${{ env.IMAGE_VERSION }}
    steps:
    - name: Check out code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        token: ${{ secrets.PAT_TOKEN }}
    - name: build 
      run: mkdir -p Software/STM/build && cd Software/STM/build && cmake -DCMAKE_BUILD_TYPE=x86_Clang .. && make
    - name: test 
      run: cd Software/STM/build && cmake -DCMAKE_BUILD_TYPE=x86_GCC .. && make test
  x86_GCC:
    runs-on: ubuntu-latest
    container:
      image: pawelwarzecha/wooden_clock:${{ env.IMAGE_VERSION }}
