syntax = "proto3";

import "nanopb.proto";

import "flashing_start.proto";
import "flashing_state.proto";
import "page_data.proto";

message McuToPcFlashingMsg {
  oneof msg {
    FlashingState flashing_state = 1;
  }
}

message PcToMcuFlashingMsg {
  oneof msg {
    FlashingStart flashing_start = 1;
    PageData      page_data      = 2;
  }
}