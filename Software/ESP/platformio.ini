[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
    knolleary/PubSubClient
    nanopb/Nanopb
custom_nanopb_protos =
    +<../Messages/protos/esp/esp_msg.proto>
    +<../Messages/protos/esp/detail/time.proto>
    +<../Messages/protos/esp/detail/weather_forecast.proto>

upload_protocol = espota


[platformio]
src_dir = ./